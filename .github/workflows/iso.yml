name: Build the Hurunagus installer ISO

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload the ISO to S3"
        required: false
        default: false
        type: boolean
      publish-release:
        description: "Publish the network ISO (~1.1 GiB) as a GitHub release asset — the full ISO is far over the 2 GiB per-file cap"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - variants.conf
      - disk_config/**
      - tools/**
      - test/**
      - Justfile
      - .github/workflows/iso.yml
  pull_request:
    paths:
      - variants.conf
      - disk_config/**
      - tools/**
      - test/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"
  ANON_ISO: "output/bootiso/install.iso"
  ISO: "output/iso/hurunagus-installer.iso"
  ISO_NET: "output/iso/hurunagus-installer-net.iso"

jobs:
  # The repack's own tests: fixture ISO in, assertive repack out.  Catches a
  # broken GRUB patch, a lost El Torito image or a bad kickstart before any
  # multi-GB build runs.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools dosfstools isomd5sum python3
      - run: bash test/test-repack.sh

  # Gate on the variant list itself: every address must be anonymously pullable
  # (or the ISO's entry would fail at install time) and known to hurubase (or the
  # rebase helper would refuse it by name later).
  refs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Clone hurubase
        run: git clone -q --depth=1 https://github.com/wegweg7979/hurunagus-rebase /tmp/hurubase
      - name: Check every variant is pullable and known
        run: |
          set -euo pipefail
          /tmp/hurubase/hurubase --list-refs | sort >/tmp/known
          awk -F'\t' '!/^[[:space:]]*#/ && NF==4 {print $1}' variants.conf | sort >/tmp/variants
          fail=0
          while read -r ref; do
            printf '%-52s ' "$ref"
            if ! skopeo inspect --no-tags "docker://$ref" >/dev/null 2>&1; then
              echo "NOT anonymously pullable"; fail=1; continue
            fi
            if ! grep -qxF "$ref" /tmp/known; then
              echo "pullable, but hurubase does not know it"; fail=1; continue
            fi
            echo ok
          done </tmp/variants
          exit $fail

  iso:
    needs: [test, refs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # required to publish the network ISO as a release asset
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true
      - name: Inspect the source image's repos
        run: |
          set -euo pipefail
          ref=$(awk -F'\t' '!/^[[:space:]]*#/ && NF==4 && $4=="offline" {print $1}' variants.conf)
          echo "source image: $ref"
          sudo podman run --rm --entrypoint bash "$ref" -lc '
            echo "--- /etc/os-release"; head -3 /etc/os-release
            echo "--- releasever: $(rpm -E %fedora 2>/dev/null || echo n/a)"
            echo "--- /etc/yum.repos.d"; ls -1 /etc/yum.repos.d/ 2>/dev/null | head -25
            echo "--- enabled= lines"; grep -H "^enabled=" /etc/yum.repos.d/*.repo 2>/dev/null | head -25
          ' || echo "::warning::could not inspect the image (no bash entrypoint?)"
      - name: Build the anaconda-iso from the offline variant
        run: |
          set -euo pipefail
          ref=$(awk -F'\t' '!/^[[:space:]]*#/ && NF==4 && $4=="offline" {print $1}' variants.conf)
          [ -n "$ref" ] || { echo "variants.conf has no offline variant"; exit 1; }
          echo "building from $ref"
          mkdir -p output
          # bootc-image-builder no longer pulls the source image itself — it must
          # already be in rootful container storage or the build dies with
          # "failed to inspect the image: image not known".
          sudo podman pull "$ref"
          run_bib() { # $1 = librepo flag
            sudo podman run --rm --privileged --pull=newer --net=host \
              --security-opt label=type:unconfined_t \
              -v "$PWD/disk_config/iso.toml":/config.toml:ro \
              -v "$PWD/output":/output \
              -v /var/lib/containers/storage:/var/lib/containers/storage \
              "$BIB_IMAGE" \
              --log-level debug --type anaconda-iso "$1" --rootfs=btrfs "$ref"
          }
          if ! run_bib "--use-librepo=True"; then
            echo "::warning::BIB failed with --use-librepo=True; retrying with --use-librepo=False"
            sudo rm -rf "${PWD:?}"/output/* 2>/dev/null || true
            run_bib "--use-librepo=False"
          fi
          sudo chown -R "$(id -u):$(id -g)" output
          ls -lh output/bootiso/install.iso
      - name: Repack into the multi-variant installer
        run: |
          mkdir -p output/iso
          podman run --rm -v "$PWD":/work -w /work registry.fedoraproject.org/fedora:45 \
            bash -c "dnf -y -q install xorriso mtools isomd5sum python3 >/dev/null &&
                     python3 tools/make-variant-iso.py --variants variants.conf \
                        --input '$ANON_ISO' --output '$ISO'"
          ls -lh "$ISO"
      - name: Upload the ISO
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hurunagus-installer-iso
          path: output/iso/hurunagus-installer.iso
          retention-days: 0
          compression-level: 0
          overwrite: true
      - name: Repack the network installer (payload deleted)
        run: |
          set -euo pipefail
          podman run --rm -v "$PWD":/work -w /work registry.fedoraproject.org/fedora:45 \
            bash -c "dnf -y -q install xorriso mtools isomd5sum python3 >/dev/null &&
                     python3 tools/make-variant-iso.py --variants variants.conf --strip-payload \
                        --input '$ANON_ISO' --output '$ISO_NET'"
          ls -lh "$ISO_NET"
          # GitHub caps a release asset at 2 GiB and this ISO exists to fit under
          # that, so fail here rather than at upload time.
          size=$(stat -c%s "$ISO_NET")
          echo "network ISO: $size bytes ($(( size / 1048576 )) MiB)"
          [ "$size" -lt 1610612736 ] || { echo "::error::network ISO exceeded 1.5 GiB"; exit 1; }
      - name: Upload the network ISO
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hurunagus-installer-net-iso
          path: output/iso/hurunagus-installer-net.iso
          retention-days: 0
          compression-level: 0
          overwrite: true
      - name: Publish the network ISO as a release asset
        if: inputs.publish-release == true && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="installer-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          gh release create "$tag" \
            --title "Hurunagus installer $tag" \
            --notes "Network installer ISO — $(stat -c%s "$ISO_NET") bytes.

          One ISO, every Hurunagus variant, chosen from the boot menu. It carries no
          payload: each menu entry installs its image from ghcr.io with Anaconda's
          \`bootc\` kickstart command, so **the network is required at install time**.
          The ~7 GiB offline ISO (embedded flagship payload, installs with no network)
          is built by the same workflow but is far over GitHub's 2 GiB per-file cap, so
          it stays an artifact.

          Entry order, and the kickstart each one runs, are generated from
          \`variants.conf\`; boot-test both firmware paths before trusting an ISO." \
            "$ISO_NET"
          gh release view "$tag" --json url,tagName,assets \
            --jq '"published \(.tagName) -> \(.url)\n" + (.assets[] | "  \(.name) \(.size) bytes")'
      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        run: |
          sudo apt-get update && sudo apt-get install -y rclone
          rclone copy output/iso "S3:${{ secrets.S3_BUCKET_NAME }}/hurunagus-installer"
