name: Build the Hurunagus installer ISO

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload the ISO to S3"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - variants.conf
      - disk_config/**
      - tools/**
      - test/**
      - Justfile
      - .github/workflows/iso.yml
  pull_request:
    paths:
      - variants.conf
      - disk_config/**
      - tools/**
      - test/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"
  ANON_ISO: "output/bootiso/install.iso"
  ISO: "output/iso/hurunagus-installer.iso"

jobs:
  # The repack's own tests: fixture ISO in, assertive repack out.  Catches a
  # broken GRUB patch, a lost El Torito image or a bad kickstart before any
  # multi-GB build runs.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools dosfstools isomd5sum python3
      - run: bash test/test-repack.sh

  # Gate on the variant list itself: every address must be anonymously pullable
  # (or the ISO's entry would fail at install time) and known to hurubase (or the
  # rebase helper would refuse it by name later).
  refs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Clone hurubase
        run: git clone -q --depth=1 https://github.com/wegweg7979/hurunagus-rebase /tmp/hurubase
      - name: Check every variant is pullable and known
        run: |
          set -euo pipefail
          /tmp/hurubase/hurubase --list-refs | sort >/tmp/known
          awk -F'\t' '!/^[[:space:]]*#/ && NF==4 {print $1}' variants.conf | sort >/tmp/variants
          fail=0
          while read -r ref; do
            printf '%-52s ' "$ref"
            if ! skopeo inspect --no-tags "docker://$ref" >/dev/null 2>&1; then
              echo "NOT anonymously pullable"; fail=1; continue
            fi
            if ! grep -qxF "$ref" /tmp/known; then
              echo "pullable, but hurubase does not know it"; fail=1; continue
            fi
            echo ok
          done </tmp/variants
          exit $fail

  iso:
    needs: [test, refs]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true
      - name: Build the anaconda-iso from the offline variant
        run: |
          set -euo pipefail
          ref=$(awk -F'\t' '!/^[[:space:]]*#/ && NF==4 && $4=="offline" {print $1}' variants.conf)
          [ -n "$ref" ] || { echo "variants.conf has no offline variant"; exit 1; }
          echo "building from $ref"
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer --net=host \
            --security-opt label=type:unconfined_t \
            -v "$PWD/disk_config/iso.toml":/config.toml:ro \
            -v "$PWD/output":/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BIB_IMAGE" \
            --type anaconda-iso --use-librepo=True --rootfs=btrfs "$ref"
          sudo chown -R "$(id -u):$(id -g)" output
      - name: Repack into the multi-variant installer
        run: |
          mkdir -p output/iso
          podman run --rm -v "$PWD":/work -w /work registry.fedoraproject.org/fedora:45 \
            bash -c "dnf -y -q install xorriso mtools isomd5sum python3 >/dev/null &&
                     python3 tools/make-variant-iso.py --variants variants.conf \
                        --input '$ANON_ISO' --output '$ISO'"
          ls -lh "$ISO"
      - name: Upload the ISO
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hurunagus-installer-iso
          path: output/iso/hurunagus-installer.iso
          retention-days: 0
          compression-level: 0
          overwrite: true
      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        run: |
          sudo apt-get update && sudo apt-get install -y rclone
          rclone copy output/iso "S3:${{ secrets.S3_BUCKET_NAME }}/hurunagus-installer"
