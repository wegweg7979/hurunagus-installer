# variants.conf — the Hurunagus installer's variant list.  ONE source of truth:
# tools/make-variant-iso.py generates the kickstart files and the boot-menu
# entries from this file, and the Justfile reads it to pick the image the
# installer ISO is built from.
#
# Fields are TAB-separated:  address <TAB> label <TAB> desktop <TAB> mode
#
#   address   full registry reference that is installed AND tracked for updates
#             (must be anonymously pullable — checked in CI)
#   label     menu text, e.g. "Install Hurunagus Silverblue"
#   desktop   what you get after the reboot; shown in the menu subtitle
#   mode      offline  the image embedded in the ISO; installs with no network
#                      and exactly ONE variant may say this
#             pull     installed from the registry; network required at install
#
# Adding a variant = one line here.  Nothing else in this repo enumerates them.
#
# Deliberately NOT listed: hurunagus-hyprland-dms, hurunagus-umbriel and the
# archived `hurunagus` repo (dead or never booted), and the `*-nvidia*` images
# (refused, not warned about).

ghcr.io/wegweg7979/hurunagus-hyprland:latest	Install Hurunagus Hyprland	Hyprland + Omarchy (the flagship)	offline
ghcr.io/wegweg7979/hurunagus-silverblue:latest	Install Hurunagus Silverblue	Silverblue + Niri + DMS	pull
ghcr.io/wegweg7979/hurunagus-ublue:latest	Install Hurunagus uBlue	uBlue + Niri + DMS	pull
